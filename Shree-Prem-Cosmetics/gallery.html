<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Us | Shree Prem Cosmetics</title>

    <link rel="icon" href="assets/images/logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7b1e3a, #b58a2b, #7b1e3a);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
        }

        .construction-box {
            width: 90%;
            max-width: 850px;
            text-align: center;
            padding: 60px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 8px;
            margin-bottom: 25px;
        }

        .small-title {
            letter-spacing: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd978;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 75px);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .construction {
            color: #ffd978;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 30px;
            opacity: 0.9;
        }

        .back-btn {
            display: inline-block;
            background: white;
            color: #7b1e3a;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #ffd978;
            color: #7b1e3a;
            transform: translateY(-3px);
        }

        .dots {
            margin-top: 30px;
        }

        .dots span {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ffd978;
            border-radius: 50%;
            margin: 0 5px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        @media (max-width: 576px) {
            .construction-box {
                padding: 45px 20px;
            }

            .logo {
                width: 85px;
                height: 85px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="construction-box">

        <img src="assets/images/logo.png"
            alt="Shree Prem Cosmetics"
            class="logo">

        <div class="small-title">
            SHREE PREM COSMETICS
        </div>

        <h1>
            Page Under<br>
            <span class="construction">Construction</span>
        </h1>

        <p>
            We're working hard to bring you something beautiful.
            This page will be available very soon.
        </p>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</body>

</html>
